name: Daily Literature Scout

on:
  schedule:
    # Runs at 2:00 AM MYT (UTC+8) which is 18:00 UTC
    - cron: '0 18 * * *'
  workflow_dispatch:
    # Allows manual trigger from the GitHub UI

jobs:
  run-scout:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Workaround for Streamlit Cloud missing package dependencies just in case
          pip install pysqlite3-binary

      - name: Run Background Literature Scout
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python src/scout.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add output/ data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Daily Literature Scout results" && git push)
